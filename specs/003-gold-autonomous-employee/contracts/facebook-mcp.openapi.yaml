openapi: 3.0.3
info:
  title: Facebook MCP Server API
  description: MCP server for Facebook Graph API v19.0 integration
  version: 1.0.0
  contact:
    name: Gold Tier AI Employee
    email: support@example.com

servers:
  - url: http://localhost:3101
    description: Local MCP server

paths:
  /health:
    get:
      summary: Health check
      description: Check if MCP server and Facebook API connection are healthy
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  facebook_connected:
                    type: boolean
                  token_valid:
                    type: boolean
                  token_expires_at:
                    type: string
                    format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts:
    post:
      summary: Create Facebook post
      description: Publish a post to Facebook page
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed (invalid or expired token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: Facebook API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{post_id}:
    get:
      summary: Get post details
      description: Retrieve details of a specific post
      operationId: getPost
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete post
      description: Delete a post from Facebook page
      operationId: deletePost
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Post deleted successfully
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{post_id}/insights:
    get:
      summary: Get post engagement metrics
      description: Retrieve engagement metrics for a post (likes, comments, shares, reach)
      operationId: getPostInsights
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post engagement metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostInsights'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pages/me:
    get:
      summary: Get page information
      description: Retrieve information about the authenticated Facebook page
      operationId: getPageInfo
      responses:
        '200':
          description: Page information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageInfo'

components:
  schemas:
    PostRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Post text content
          minLength: 1
          maxLength: 63206
        link:
          type: string
          format: uri
          description: URL to include in post
        image_url:
          type: string
          format: uri
          description: URL of image to attach (must be publicly accessible)
        published:
          type: boolean
          default: true
          description: Whether to publish immediately or save as draft

    PostResponse:
      type: object
      properties:
        post_id:
          type: string
          description: Facebook post ID
        message:
          type: string
        link:
          type: string
        created_time:
          type: string
          format: date-time
        permalink_url:
          type: string
          format: uri
          description: Public URL to view the post

    PostInsights:
      type: object
      properties:
        post_id:
          type: string
        likes:
          type: integer
          description: Number of likes/reactions
        comments:
          type: integer
          description: Number of comments
        shares:
          type: integer
          description: Number of shares
        reach:
          type: integer
          description: Number of unique users who saw the post
        impressions:
          type: integer
          description: Total number of times the post was displayed
        engagement:
          type: integer
          description: Total engagement (likes + comments + shares)
        engagement_rate:
          type: number
          description: Engagement rate as percentage (engagement / reach * 100)
        retrieved_at:
          type: string
          format: date-time

    PageInfo:
      type: object
      properties:
        page_id:
          type: string
        name:
          type: string
        category:
          type: string
        followers_count:
          type: integer
        fan_count:
          type: integer
        access_token_expires_at:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        error_subcode:
          type: integer
          description: Facebook API error subcode
        details:
          type: object
          description: Additional error details
        timestamp:
          type: string
          format: date-time

    RateLimitError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            retry_after:
              type: integer
              description: Seconds to wait before retrying
            rate_limit:
              type: object
              properties:
                limit:
                  type: integer
                  description: Maximum requests per hour
                remaining:
                  type: integer
                  description: Remaining requests in current window
                reset_at:
                  type: string
                  format: date-time
                  description: When the rate limit resets

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for MCP server authentication

security:
  - ApiKey: []
